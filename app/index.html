<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <title>Flex Draw</title>
    <script>try{var t=localStorage.getItem('flexdraw.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/app/main.ts"></script>
  </body>
</html>
